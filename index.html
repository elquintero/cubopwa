<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Cubo Timer</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#252c36;--tx:#e6edf3;--mu:#7d8590;--ac:#5aa9ff;--ok:#3ddc97;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;gap:10px;padding:12px 0}
header h1{font-size:17px;margin:0;font-weight:650;flex:1}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.primary{background:var(--ac);border-color:var(--ac);color:#06101c;font-weight:600}
#status{font-size:13px;color:var(--mu)}#status.on{color:var(--ok)}
main{display:grid;gap:14px;max-width:980px;margin:0 auto;padding-bottom:30px}
@media(min-width:820px){main{grid-template-columns:360px 1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:13px;font-weight:600;color:var(--mu);margin:0 0 10px}
#cv{width:100%;max-width:332px;aspect-ratio:1;display:block;margin:0 auto;touch-action:none;cursor:grab}
#timer{font-size:clamp(56px,16vw,92px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;padding:6px 0;cursor:pointer;user-select:none}
#timer.ready{color:var(--ok)}#timer.run{color:var(--tx)}
#phase{text-align:center;color:var(--mu);min-height:20px}
#scr{text-align:center;font-size:19px;letter-spacing:.5px;margin:8px 0;word-spacing:6px;min-height:28px}
#scr span{font-weight:600}
#scr .d{color:var(--ok)}#scr .c{color:var(--tx);border-bottom:2px solid var(--tx)}#scr .p{color:#ffd54a;border-bottom:2px solid #ffd54a}#scr .e{color:#ff9a3d;border-bottom:2px solid #ff9a3d}#scr .n{color:var(--tx)}#scr .f{color:var(--mu)}
#hint{text-align:center;min-height:20px;font-size:14px}#hint.p{color:#ffd54a}#hint.e{color:#ff9a3d}
#live{text-align:center;color:var(--mu);font-size:13px;min-height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left;color:var(--mu)}
#hist{max-height:300px;overflow:auto}
#hist div{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
#hist .n{color:var(--mu);width:34px}#hist .t{font-weight:600;width:80px}#hist .i{color:var(--mu);flex:1;font-size:13px}
#hist button{padding:2px 7px;font-size:12px}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pad button{padding:8px 0;text-align:center}
details{margin-top:12px}summary{cursor:pointer;color:var(--mu);font-size:13px}
#log{font:12px ui-monospace,Menlo,monospace;color:var(--mu);white-space:pre;overflow:auto;max-height:140px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--panel);border:1px solid var(--ac);padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Cubo Timer</h1>
  <span id="status">Sin cubo</span>
  <button class="primary" id="btnConn">Conectar cubo</button>
</header>
<main>
  <section>
    <h2>Cubo en tiempo real</h2>
    <canvas id="cv" width="664" height="664" aria-label="Vista 3D del cubo"></canvas>
    <div class="row">
      <button id="btnReset" title="Marca el cubo físico como resuelto">Cubo resuelto</button>
      <button id="btnView">Vista</button>
    </div>
    <details>
      <summary>Simulador y registro Bluetooth</summary>
      <p style="color:var(--mu);font-size:13px;margin:8px 0">Sin cubo: usa el teclado (U D L R F B, con Shift = inverso) o estos botones.</p>
      <div class="pad" id="pad"></div>
      <div class="row"><button id="btnApply">Aplicar scramble al cubo virtual</button></div>
      <div id="log">Aquí aparecerán los datos crudos del cubo.</div>
    </details>
  </section>

  <div style="display:grid;gap:14px;align-content:start">
    <section>
      <div id="phase"></div>
      <div id="scr"></div>
      <div id="hint"></div>
      <div id="timer">0.00</div>
      <div id="live"></div>
      <div class="row"><button id="btnSkip">Saltar scramble</button><button id="btnNew">Otro scramble</button></div>
    </section>
    <section>
      <h2>Estadísticas</h2>
      <table id="stats"></table>
      <div id="extra" style="color:var(--mu);font-size:13px;margin-top:8px"></div>
    </section>
    <section>
      <h2>Historial</h2>
      <div id="hist"></div>
      <div class="row"><button id="btnExport">Exportar JSON</button><button id="btnClear">Borrar todo</button></div>
    </section>
  </div>
</main>
<div id="toast"></div>

<script>
/* ===== Modelo del cubo: 54 pegatinas con posición, normal y color ===== */
const FACES={U:[0,1,0],D:[0,-1,0],F:[0,0,1],B:[0,0,-1],R:[1,0,0],L:[-1,0,0]};
const COL={U:'#f2f2f2',D:'#ffd500',F:'#1faa59',B:'#2a6fdb',R:'#d93a2b',L:'#ff8a1f'};
const NAME={};for(const f in FACES)NAME[FACES[f]]=f;
const solvedCube=()=>{const s=[];for(const f in FACES){const n=FACES[f];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
  s.push({p:n[1]?[a,n[1],b]:n[0]?[n[0],a,b]:[a,b,n[2]],n:[...n],c:f})}}return s};
const ROT={ // giro de 90° antihorario respecto al eje (regla mano derecha)
  0:v=>[v[0],-v[2],v[1]],1:v=>[v[2],v[1],-v[0]],2:v=>[-v[1],v[0],v[2]]};
const mv=(cube,m)=>{
  const f=m[0],q=m.endsWith("'")?3:m.endsWith('2')?2:1,n=FACES[f],ax=n.findIndex(x=>x),sg=n[ax];
  // horario visto desde la cara = antihorario si el eje es negativo, 3 giros antihorarios si es positivo
  const times=sg>0?3*q:q;
  for(const s of cube)if(s.p[ax]===sg)for(let i=0;i<times;i++){s.p=ROT[ax](s.p);s.n=ROT[ax](s.n)}
};
const sig=c=>c.map(s=>s.p+'|'+s.n+'|'+s.c).sort().join();
const isSolved=c=>c.every(s=>s.c===NAME[s.n]);
const build=ms=>{const c=solvedCube();ms.forEach(m=>mv(c,m));return c};
const genScramble=(n=20)=>{const out=[],ax={U:0,D:0,L:1,R:1,F:2,B:2};let last=-1;
  while(out.length<n){const f='UDLRFB'[Math.random()*6|0];if(ax[f]===last)continue;last=ax[f];out.push(f+["","'","2"][Math.random()*3|0])}return out};

/* ===== Render 3D en canvas ===== */
const cv=document.getElementById('cv'),g=cv.getContext('2d');
let A=-0.6,Bt=0.45,flip=false;
const view=v=>{const a=A,b=flip?-Bt:Bt;let x=v[0]*Math.cos(a)+v[2]*Math.sin(a),z=-v[0]*Math.sin(a)+v[2]*Math.cos(a);
  const y=v[1]*Math.cos(b)-z*Math.sin(b);z=v[1]*Math.sin(b)+z*Math.cos(b);return[x,y,z]};
let disp=solvedCube(),queue=[],anim=null;
const clone=c=>c.map(s=>({p:[...s.p],n:[...s.n],c:s.c}));
const rotV=(v,ax,t)=>{const c=Math.cos(t),s=Math.sin(t),[x,y,z]=v;return ax===0?[x,y*c-z*s,y*s+z*c]:ax===1?[x*c+z*s,y,-x*s+z*c]:[x*c-y*s,x*s+y*c,z]};
function draw(){
  const W=cv.width,S=W/5.4,Q=[];g.clearRect(0,0,W,W);
  for(const s of disp){
    const n=s.n,inL=anim&&s.p[anim.ax]===anim.sg,rot=v=>inL?rotV(v,anim.ax,anim.th):v;
    const nv=view(rot(n));if(nv[2]<=0.001&&!anim)continue;
    const u=n[1]||n[2]?[1,0,0]:[0,1,0],vv=n[2]?[0,1,0]:[0,0,1],c=s.p.map((x,i)=>x+n[i]*0.5);
    const polys=[[0.5,'#0b0d10'],[0.43,COL[s.c]]].map(([h,col])=>[col,[[-1,-1],[1,-1],[1,1],[-1,1]].map(([i,j])=>view(rot(c.map((x,t)=>x+h*(i*u[t]+j*vv[t])))))]);
    Q.push({z:view(rot(c))[2],polys});
  }
  Q.sort((a,b)=>a.z-b.z);
  for(const q of Q)for(const [col,pts] of q.polys){g.beginPath();pts.forEach((P,k)=>{const X=W/2+P[0]*S,Y=W/2-P[1]*S;k?g.lineTo(X,Y):g.moveTo(X,Y)});g.closePath();g.fillStyle=col;g.fill()}
}
function pump(){ // anima los giros en cola (más rápido si se acumulan)
  if(anim||!queue.length)return;
  const m=queue.shift(),q=m.endsWith("'")?-1:m.endsWith('2')?2:1,n=FACES[m[0]],ax=n.findIndex(x=>x),sg=n[ax];
  const dur=Math.max(35,140/(1+queue.length)),t0=performance.now(),th=-sg*q*Math.PI/2;
  const step=now=>{const k=Math.min(1,(now-t0)/dur);anim={ax,sg,th:th*k*k*(3-2*k)};
    if(k<1){draw();requestAnimationFrame(step)}else{mv(disp,m);anim=null;draw();pump()}};
  requestAnimationFrame(step);
}
function showCube(c){cube=c;disp=clone(c);queue=[];anim=null;draw()}
function setFacelets(str,first){ // refleja el estado real que reporta el cubo (URFDLB)
  if(str.length!==54)return;const c=solvedCube();
  const P={U:(r,k)=>[-1+k,1,-1+r],R:(r,k)=>[1,1-r,1-k],F:(r,k)=>[-1+k,1-r,1],D:(r,k)=>[-1+k,-1,1-r],L:(r,k)=>[-1,1-r,-1+k],B:(r,k)=>[1-k,1-r,-1]};
  'URFDLB'.split('').forEach((f,fi)=>{for(let i=0;i<9;i++){const p=P[f](i/3|0,i%3);c.find(x=>x.n+''===FACES[f]+''&&x.p+''===p+'').c=str[fi*9+i]}});
  if(sig(c)===sig(cube)&&!first)return;
  showCube(c);if(first&&phase==='scramble')newScramble();else checkPhase();
}
function checkPhase(){if(phase==='scramble')trackSync();else if(phase==='running'&&isSolved(cube))finish()}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;A+=(e.clientX-drag[0])*0.01;Bt=Math.max(-1.4,Math.min(1.4,Bt+(e.clientY-drag[1])*0.01));drag=[e.clientX,e.clientY];draw()});
cv.addEventListener('pointerup',()=>drag=null);
document.getElementById('btnView').onclick=()=>{flip=!flip;draw()};

/* ===== Estado de la resolución ===== */
let cube=solvedCube(),phase='scramble',scr=[],targetSig='',t0=0,mvs=[];
const $=id=>document.getElementById(id);
const fmt=ms=>{if(ms===Infinity)return'DNF';const s=ms/1000;return s>=60?Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0'):s.toFixed(2)};
const toast=m=>{const t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)};
function setPhase(p){phase=p;const T=$('timer');
  $('phase').textContent={scramble:'Haz este scramble (blanco arriba, verde delante)',ready:'Listo: haz un movimiento para empezar',running:'Resolviendo…'}[p];
  T.className=p==='ready'?'ready':p==='running'?'run':'';
  if(p==='ready'){T.textContent='0.00';$('live').textContent=''}if(scr.length)renderScr()}
let prog=0,wrong=[],pre=[];
const OPP={U:'D',D:'U',L:'R',R:'L',F:'B',B:'F'},qOf=m=>m.endsWith("'")?3:m.endsWith('2')?2:1,qs=(f,q)=>f+['','','2',"'"][q];
function newScramble(){scr=genScramble();const c=clone(cube);pre=[sig(c)];scr.forEach(m=>{mv(c,m);pre.push(sig(c))});prog=0;wrong=[];setPhase('scramble');renderScr()}
function renderScr(){ // verde = bien · amarillo = medio giro · naranja = error
  const el=$('scr'),h=$('hint');el.innerHTML='';
  const e=scr[prog],half=wrong.length===1&&e&&wrong[0][0]===e[0]&&qOf(e)===2;
  scr.forEach((m,i)=>{const sp=document.createElement('span');
    sp.className=phase==='scramble'?(i<prog?'d':i>prog?'n':!wrong.length?'c':half?'p':'e'):phase==='ready'?'d':'f';
    sp.textContent=m;el.appendChild(sp);el.appendChild(document.createTextNode(' '))});
  if(phase==='scramble'&&wrong.length){h.className=half?'p':'e';
    h.textContent=half?'Medio giro hecho: repite el mismo movimiento':'Error. Deshaz: '+wrong.slice().reverse().map(([f,q])=>qs(f,(4-q)%4)).join(' ')}
  else{h.className='';h.textContent=''}
}
function trackSync(){const j=pre.indexOf(sig(cube));if(j>=0){prog=j;wrong=[]}renderScr();if(phase==='scramble'&&prog===scr.length)setPhase('ready')}
function trackMove(m){
  const f=m[0],q=qOf(m);let k=wrong.length-1;
  while(k>=0&&wrong[k][0]!==f&&OPP[f]===wrong[k][0])k--;
  if(k>=0&&wrong[k][0]===f){wrong[k][1]=(wrong[k][1]+q)%4;if(!wrong[k][1])wrong.splice(k,1)}else wrong.push([f,q]);
  const e=scr[prog];
  if(wrong.length===1&&e&&wrong[0][0]===e[0]&&wrong[0][1]===qOf(e)){wrong=[];prog++}
  trackSync();
}
function onMove(m){
  mv(cube,m);queue.push(m);pump();
  if(phase==='scramble')trackMove(m);
  else if(phase==='ready'){t0=performance.now();mvs=[{m,t:0}];setPhase('running');tick()}
  else if(phase==='running'){mvs.push({m,t:performance.now()-t0});$('live').textContent=mvs.slice(-12).map(x=>x.m).join(' ');if(isSolved(cube))finish()}
}
function tick(){if(phase!=='running')return;$('timer').textContent=fmt(performance.now()-t0);requestAnimationFrame(tick)}
function finish(){
  const t=Math.round(performance.now()-t0);
  solves.push({t,m:mvs.length,s:scr.join(' '),d:Date.now(),p:0});save();
  $('timer').textContent=fmt(t);$('live').textContent=mvs.length+' mov · '+(mvs.length/(t/1000)).toFixed(2)+' TPS';
  renderStats();const T=$('timer');newScramble();T.className='';$('timer').textContent=fmt(t);
}
function manual(){ // espacio / toque: sin cubo o para saltar pasos
  if(phase==='scramble')setPhase('ready');
  else if(phase==='ready'){t0=performance.now();mvs=[];setPhase('running');tick()}
  else if(phase==='running'){const t=Math.round(performance.now()-t0);if(mvs.length===0){solves.push({t,m:0,s:scr.join(' '),d:Date.now(),p:0});save();renderStats()}
    else finish();phase!=='scramble'&&(newScramble(),$('timer').textContent=fmt(t))}
}
$('timer').onclick=manual;$('btnSkip').onclick=()=>phase==='scramble'&&setPhase('ready');
$('btnNew').onclick=()=>{if(phase!=='running')newScramble()};
$('btnReset').onclick=()=>{showCube(solvedCube());newScramble();toast('Cubo marcado como resuelto')};
$('btnApply').onclick=()=>{if(phase==='scramble')scr.forEach(m=>onMove(m))};
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)manual();return}
  const k=e.key.toUpperCase();if('UDLRFB'.includes(k)&&k.length===1&&!e.ctrlKey&&!e.metaKey)onMove(k+(e.shiftKey?"'":''))});
const pad=$('pad');for(const f of 'UDLRFB')for(const s of['',"'"]){const b=document.createElement('button');b.textContent=f+s;b.onclick=()=>onMove(f+s);pad.appendChild(b)}

/* ===== Estadísticas ===== */
let solves=[];try{solves=JSON.parse(localStorage.getItem('solves')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('solves',JSON.stringify(solves))}catch(e){}};
const val=s=>s.p===2?Infinity:s.t+(s.p===1?2000:0);
function avg(a,n){if(a.length<n)return null;const w=a.slice(-n).sort((x,y)=>x-y),k=Math.ceil(n*0.05),m=w.slice(k,n-k);
  return m.includes(Infinity)?Infinity:m.reduce((x,y)=>x+y,0)/m.length}
const best=(a,n)=>{let b=null;for(let i=n;i<=a.length;i++){const r=avg(a.slice(0,i),n);if(r!==null&&(b===null||r<b))b=r}return b};
function renderStats(){
  const v=solves.map(val),rows=[['single',v.length?v[v.length-1]:null,v.length?Math.min(...v):null]];
  for(const n of[5,12,50,100])rows.push(['ao'+n,avg(v,n),best(v,n)]);
  const f=x=>x===null?'-':fmt(x);
  $('stats').innerHTML='<tr><th></th><th>Ahora</th><th>Mejor</th></tr>'+rows.map(r=>`<tr><td>${r[0]}</td><td>${f(r[1])}</td><td>${f(r[2])}</td></tr>`).join('');
  const ok=solves.filter(s=>s.p!==2&&s.m>0),tps=ok.length?ok.reduce((a,s)=>a+s.m/(s.t/1000),0)/ok.length:0,fin=v.filter(x=>x!==Infinity);
  $('extra').textContent=`${solves.length} resoluciones · media ${fin.length?fmt(fin.reduce((a,b)=>a+b,0)/fin.length):'-'} · TPS medio ${tps?tps.toFixed(2):'-'}`;
  $('hist').innerHTML=solves.length?'':'Aún no hay resoluciones. Conecta el cubo o usa el simulador.';
  solves.map((s,i)=>[s,i]).slice(-50).reverse().forEach(([s,i])=>{
    const d=document.createElement('div');
    d.innerHTML=`<span class="n">${i+1}</span><span class="t">${fmt(val(s))}${s.p===1?'+':''}</span><span class="i">${s.m?s.m+' mov · '+(s.m/(s.t/1000)).toFixed(1)+' TPS':'manual'}</span>`;
    for(const [l,fn] of[['+2',()=>s.p=s.p===1?0:1],['DNF',()=>s.p=s.p===2?0:2],['✕',()=>solves.splice(i,1)]]){
      const b=document.createElement('button');b.textContent=l;b.onclick=()=>{fn();save();renderStats()};d.appendChild(b)}
    $('hist').appendChild(d)});
}
$('btnClear').onclick=()=>{if(confirm('¿Borrar todas las resoluciones?')){solves=[];save();renderStats()}};
$('btnExport').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(solves,null,1)],{type:'application/json'}));a.download='resoluciones.json';a.click()};

/* ===== Bluetooth ===== */
const SERVICES=['6e400001-b5a3-f393-e0a9-e50e24dc4179','00000010-0000-fff7-fff6-fff5fff4fff0','0000aadb-0000-1000-8000-00805f9b34fb',
  '0000fff0-0000-1000-8000-00805f9b34fb','0783b03e-7735-b5a0-1760-a305d2795cb0','0000180a-0000-1000-8000-00805f9b34fb'];
/* Decodificadores por marca: reciben bytes y llaman onMove("R'") etc. Se añadirán cuando sepamos la marca. */
const DRIVERS={/* 'GAN': bytes=>{...}, 'GiiKER': bytes=>{...} */};
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join(' ');
let lines=[];const log=s=>{lines.push(s);lines=lines.slice(-30);$('log').textContent=lines.join('\n')};
async function rawConnect(){
  if(!navigator.bluetooth){toast('Web Bluetooth no está disponible. Usa Chrome en Android u ordenador (no iOS).');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SERVICES});
    const srv=await dev.gatt.connect();$('status').textContent=dev.name||'Cubo';$('status').className='on';
    dev.addEventListener('gattserverdisconnected',()=>{$('status').textContent='Desconectado';$('status').className=''});
    const drv=Object.keys(DRIVERS).find(k=>(dev.name||'').startsWith(k));
    log('Dispositivo: '+dev.name+(drv?' (driver '+drv+')':' (sin driver aún)'));
    for(const sv of await srv.getPrimaryServices()){
      log('Servicio '+sv.uuid);
      for(const ch of await sv.getCharacteristics()){
        log('  char '+ch.uuid+' '+Object.keys(ch.properties).filter(k=>ch.properties[k]).join(','));
        if(ch.properties.notify){await ch.startNotifications();
          ch.addEventListener('characteristicvaluechanged',e=>{const b=new Uint8Array(e.target.value.buffer);log(ch.uuid.slice(4,8)+': '+hex(b));if(drv)DRIVERS[drv](b,onMove)})}
      }}
    toast('Conectado a '+(dev.name||'cubo'));
  }catch(e){toast('No se pudo conectar: '+e.message)}
}
window.app={onMove:m=>onMove(m),toast,log,setStatus:(t,on)=>{$('status').textContent=t;$('status').className=on?'on':''},setFacelets,resync:()=>{showCube(solvedCube());newScramble()}};
$('btnConn').onclick=()=>window.connectCube?window.connectCube(window.app):rawConnect();

/* ===== Arranque ===== */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
draw();renderStats();newScramble();
</script>
