<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>CubIQ</title>
<style>
:root{--bg:#0b0d10;--tx:#e8ecf1;--mu:#6b7380;--line:#1c2128;--ac:#5aa9ff;--ok:#3ddc97;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 18px env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:6px}
header{display:flex;align-items:center;gap:6px;height:56px;max-width:560px;margin:0 auto}
.sp{flex:1}
.brand{font:700 20px/1 Poppins,ui-rounded,system-ui,sans-serif;letter-spacing:-.02em}
.brand span{background:linear-gradient(100deg,#ff9f1c,#ff3d81 40%,#a64dff 70%,#4d7cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#btnConn{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px}
#btnConn i{width:8px;height:8px;border-radius:50%;background:#3a414b}
#btnConn:has(#status.on){color:var(--tx)}#btnConn:has(#status.on) i{background:var(--ok)}
.icon{width:38px;height:38px;display:grid;place-items:center;color:var(--mu);border-radius:10px}
.icon:hover,#btnConn:hover{color:var(--tx)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:4vh 0 30px}
#scr{font:500 clamp(18px,4.6vw,24px)/1.7 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;min-height:42px}
#scr span{margin:0 .12em;padding-bottom:1px}
#scr .d{color:var(--ok)}#scr .c{border-bottom:2px solid var(--tx)}#scr .p{color:#ffd54a;border-bottom:2px solid #ffd54a}
#scr .e{color:#ff9a3d;border-bottom:2px solid #ff9a3d}#scr .n{color:var(--tx)}#scr .f{color:var(--mu)}
#hint{min-height:22px;font-size:14px}#hint.p{color:#ffd54a}#hint.e{color:#ff9a3d}
#timer{font-family:Poppins,ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-size:clamp(72px,24vw,132px);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:3vh 0 0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#timer.ready{font-size:clamp(60px,19vw,112px);font-weight:700;letter-spacing:-.01em;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(100deg,#ff9f1c,#ff3d81,#a64dff,#4d7cff,#ff9f1c) 0 0/300% 100% repeat-x;-webkit-background-clip:text;background-clip:text;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:150% 0}}#timer.insp{color:#ffd54a}
#phase{color:var(--mu);font-size:13px;min-height:20px}
#live{color:var(--mu);font-size:13px;min-height:20px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#quick{display:flex;gap:22px;color:var(--mu);font-size:14px;min-height:24px;margin-top:8px;font-variant-numeric:tabular-nums}
#quick b{color:var(--tx);font-weight:500}
#cv{width:100%;max-width:260px;aspect-ratio:1;margin:18px 0 6px;touch-action:none;cursor:grab}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;color:var(--mu);font-size:13px}
.links button:hover{color:var(--tx)}
dialog{background:#12161b;color:var(--tx);border:1px solid var(--line);border-radius:16px;width:min(520px,94vw);max-height:90vh;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.dh h2{font-size:16px;font-weight:600;margin:0}
.dh button{color:var(--mu);font-size:18px;width:32px;height:32px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.opt small{display:block;color:var(--mu);margin-top:2px;font-size:13px}
input[role=switch]{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#262d36;position:relative;flex:none;cursor:pointer;transition:background .2s}
input[role=switch]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:transform .2s}
input[role=switch]:checked{background:var(--ok)}input[role=switch]:checked::after{transform:translateX(18px);background:#06101c}
input[role=switch]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 0 10px}
.mu{color:var(--mu);font-size:13px}
.dev{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;gap:8px;text-align:left}.dev.on{border-color:var(--ok)}
.dt{display:flex;align-items:center;gap:8px}.badge{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--ac)}
.ic{color:var(--mu);padding:2px 6px}.mac{display:flex;gap:8px;align-items:center;width:100%;background:#0b0d10;border-radius:8px;padding:8px 10px}.mac code{flex:1;text-align:left;font-size:13px}
.del{color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:8px}.del:hover{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--tx)}.btn:hover{border-color:var(--mu)}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mu);font-size:12px}th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left;color:var(--mu)}
#chart{width:100%;height:140px;display:block;margin:14px 0}
#hist{max-height:240px;overflow:auto}
#hist div{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
#hist .n{color:var(--mu);width:34px}#hist .t{font-weight:600;width:80px}#hist .i{color:var(--mu);flex:1;font-size:13px}
#hist button{color:var(--mu);font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:6px}#hist button:hover{color:var(--tx)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}.pad button{border:1px solid var(--line);border-radius:8px;padding:8px 0}
details{margin-top:18px}summary{cursor:pointer;color:var(--mu);font-size:13px}
#log{font:12px ui-monospace,Menlo,monospace;color:var(--mu);white-space:pre;overflow:auto;max-height:140px;margin-top:8px}
#trainbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px}
#trainbar[hidden],#alert[hidden]{display:none}
#trainbar svg,#alIcon svg{display:block;border-radius:8px}
.tr-tx{flex:1;min-width:0;display:grid;gap:2px}.tr-tx code{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--tx);word-break:break-word}
#alert{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0));transform:translateX(-50%);width:min(560px,94vw);background:#12161b;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:40}
.al-in{display:flex;align-items:center;gap:14px;padding:14px 14px 16px;flex-wrap:wrap}
.al-tx{flex:1;min-width:180px;display:grid;gap:2px;text-align:left}.al-tx b{font-size:15px}.al-tx span{color:var(--mu);font-size:13px}
.al-btn{display:flex;gap:8px;flex-wrap:wrap}.btn.pri{background:var(--ac);border-color:var(--ac);color:#06101c;font-weight:600}
kbd{font:600 11px ui-monospace,Menlo,monospace;opacity:.7;margin-left:4px}
#alBar{height:3px;background:linear-gradient(90deg,#ff9f1c,#ff3d81,#a64dff,#4d7cff);transform-origin:left;animation:shrink 14s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){#timer.ready,#alBar{animation:none}}
#calDots{display:flex;gap:8px;justify-content:center;margin:4px 0 8px}
#calDots span{width:30px;height:4px;border-radius:2px;background:#262d36}#calDots .done{background:var(--ok)}#calDots .on{background:var(--tx)}
#calCv{display:block;width:min(260px,68vw);aspect-ratio:1;margin:0 auto}
#calAct{font-weight:600;font-size:17px;text-align:center;margin:6px 0 2px}#calTxt{text-align:center;margin:0}
#calMeter{height:8px;border-radius:4px;background:#1c2128;overflow:hidden;margin:14px 0 6px}
#calBar{height:100%;width:0;background:var(--ac);transition:width .12s}#calBar.ok{background:var(--ok)}
#calAng{text-align:center;min-height:20px}
.btn:disabled{opacity:.4;cursor:default}
@media(prefers-reduced-motion:reduce){#calBar{transition:none}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#1a2027;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;font-size:14px}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast,input[role=switch],input[role=switch]::after{transition:none}}
</style>
</head>
<body>
<header>
  <span class="brand">Cub<span>IQ</span></span>
  <span class="sp"></span>
  <button id="btnConn"><i></i><span id="status">Conectar cubo</span></button>
  <button class="icon" id="btnStats" aria-label="Estadísticas" title="Estadísticas"><svg viewBox="0 0 24 24"><path d="M6 20V11M12 20V4M18 20v-6"/></svg></button>
  <button class="icon" id="btnSet" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
</header>
<main>
  <div id="trainbar" hidden><div id="trIcon"></div><div class="tr-tx"><b id="trTitle"></b><code id="trAlg"></code><span id="trStat" class="mu"></span></div><button class="btn" id="trExit">Salir</button></div>
  <div id="scr"></div>
  <div id="hint"></div>
  <div id="timer">0.00</div>
  <div id="phase"></div>
  <div id="live"></div>
  <div id="quick"></div>
  <canvas id="cv" width="520" height="520" aria-label="Vista 3D del cubo"></canvas>
  <nav class="links">
    <button id="btnSkip">saltar scramble</button><button id="btnNew">otro scramble</button><button id="btnReset" title="Marca el cubo físico como resuelto">cubo resuelto</button><button id="btnView">girar vista</button><button id="btnGyro" hidden>centrar giroscopio [U4]</button>
  </nav>
</main>

<dialog id="dlgStats" aria-label="Estadísticas">
  <div class="dh"><h2>Estadísticas</h2><button id="stClose" aria-label="Cerrar">✕</button></div>
  <table id="stats"></table>
  <div id="extra" class="mu" style="margin-top:8px"></div>
  <canvas id="chart" aria-label="Evolución de los tiempos"></canvas>
  <div id="hist"></div>
  <div class="row"><button class="btn" id="btnExport">Exportar JSON</button><button class="btn" id="btnClear">Borrar todo</button></div>
</dialog>

<dialog id="dlg" aria-label="Ajustes">
  <div class="dh"><h2>Ajustes</h2><button id="dlgClose" aria-label="Cerrar">✕</button></div>
  <label class="opt"><span><b>Inspección de 15 s</b><small>Cuenta atrás antes de resolver. Tras 15 s se aplica +2 y tras 17 s, DNF</small></span><input type="checkbox" role="switch" id="oInsp"></label>
  <label class="opt"><span><b>Inicio automático</b><small>Empieza al realizar un giro cuando el scramble está hecho y aparece ¡Start!</small></span><input type="checkbox" role="switch" id="oAuto"></label>
  <label class="opt"><span><b>Animación de éxito</b><small>Reproduce una animación cuando el cubo está resuelto o un caso de entrenamiento terminado</small></span><input type="checkbox" role="switch" id="oSucc"></label>
  <label class="opt"><span><b>Análisis y consejos</b><small>Recibe alertas instantáneas sobre cómo podrías haber ahorrado tiempo y empieza al instante un ejercicio para aprender el mejor algoritmo</small></span><input type="checkbox" role="switch" id="oIns"></label>
  <label class="opt"><span><b>Giroscopio</b><small>El cubo virtual se mueve como el real, en tiempo real (si tu cubo lo permite)</small></span><input type="checkbox" role="switch" id="oGyro"></label>
  <div class="mu" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0 0"><span id="gyroSt">Sin datos todavía</span><button class="btn" id="btnCal">Calibrar ejes</button></div>
  <h3>Dispositivos conectados</h3>
  <div id="devs"></div>
  <div class="row"><button class="btn" id="btnNewDev">Conectar otro cubo</button></div>
  <details>
    <summary>Avanzado: simulador y registro Bluetooth</summary>
    <p class="mu">Sin cubo: teclado (U D L R F B, Shift = inverso) o estos botones.</p>
    <div class="pad" id="pad"></div>
    <div class="row"><button class="btn" id="btnApply">Aplicar scramble al cubo virtual</button></div>
    <div id="log">Aquí aparecerán los datos crudos del cubo.</div>
  </details>
  <h3>Acerca de</h3>
  <p class="mu" style="margin:0">CubIQ · versión <span id="ver">1.2.1</span></p>
</dialog>
<dialog id="dlgCal" aria-label="Calibrar giroscopio">
  <div class="dh"><h2 id="calT">Calibrar</h2><button id="calX" aria-label="Cerrar">✕</button></div>
  <div id="calDots" aria-hidden="true"></div>
  <canvas id="calCv" width="520" height="520" aria-hidden="true"></canvas>
  <p id="calAct"></p>
  <p id="calTxt" class="mu"></p>
  <div id="calMeter"><div id="calBar"></div></div>
  <div id="calAng" class="mu" role="status" aria-live="polite"></div>
  <div class="row"><button class="btn pri" id="calNext">Siguiente</button><button class="btn" id="calCancel">Cancelar</button></div>
</dialog>
<div id="alert" role="status" aria-live="polite" hidden>
  <div class="al-in">
    <div id="alIcon"></div>
    <div class="al-tx"><b id="alTitle"></b><span id="alText"></span></div>
    <div class="al-btn"><button class="btn pri" id="alLearn">Aprender <kbd>R4</kbd></button><button class="btn" id="alDismiss">Descartar <kbd>L4</kbd></button></div>
  </div>
  <div id="alBar"></div>
</div>
<div id="toast"></div>

<script>
/* ===== Modelo del cubo: 54 pegatinas con posición, normal y color ===== */
const FACES={U:[0,1,0],D:[0,-1,0],F:[0,0,1],B:[0,0,-1],R:[1,0,0],L:[-1,0,0]};
const COL={U:'#f2f2f2',D:'#ffd500',F:'#1faa59',B:'#2a6fdb',R:'#d93a2b',L:'#ff8a1f'};
const NAME={};for(const f in FACES)NAME[FACES[f]]=f;
const solvedCube=()=>{const s=[];for(const f in FACES){const n=FACES[f];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
  s.push({p:n[1]?[a,n[1],b]:n[0]?[n[0],a,b]:[a,b,n[2]],n:[...n],c:f})}}return s};
const ROT={ // giro de 90° antihorario respecto al eje (regla mano derecha)
  0:v=>[v[0],-v[2],v[1]],1:v=>[v[2],v[1],-v[0]],2:v=>[-v[1],v[0],v[2]]};
const mv=(cube,m)=>{
  const f=m[0],q=m.endsWith("'")?3:m.endsWith('2')?2:1,n=FACES[f],ax=n.findIndex(x=>x),sg=n[ax];
  // horario visto desde la cara = antihorario si el eje es negativo, 3 giros antihorarios si es positivo
  const times=sg>0?3*q:q;
  for(const s of cube)if(s.p[ax]===sg)for(let i=0;i<times;i++){s.p=ROT[ax](s.p);s.n=ROT[ax](s.n)}
};
const sig=c=>c.map(s=>s.p+'|'+s.n+'|'+s.c).sort().join();
const isSolved=c=>c.every(s=>s.c===NAME[s.n]);
const build=ms=>{const c=solvedCube();ms.forEach(m=>mv(c,m));return c};
const genScramble=(n=20)=>{const out=[],ax={U:0,D:0,L:1,R:1,F:2,B:2};let last=-1;
  while(out.length<n){const f='UDLRFB'[Math.random()*6|0];if(ax[f]===last)continue;last=ax[f];out.push(f+["","'","2"][Math.random()*3|0])}return out};

/* ===== Render 3D en canvas ===== */
const cv=document.getElementById('cv'),g=cv.getContext('2d');
let A=-0.6,Bt=0.45,flip=false;
const view=v=>{const a=A,b=flip?-Bt:Bt;let x=v[0]*Math.cos(a)+v[2]*Math.sin(a),z=-v[0]*Math.sin(a)+v[2]*Math.cos(a);
  const y=v[1]*Math.cos(b)-z*Math.sin(b);z=v[1]*Math.sin(b)+z*Math.cos(b);return[x,y,z]};
let disp=solvedCube(),queue=[],anim=null;
const clone=c=>c.map(s=>({p:[...s.p],n:[...s.n],c:s.c}));
const rotV=(v,ax,t)=>{const c=Math.cos(t),s=Math.sin(t),[x,y,z]=v;return ax===0?[x,y*c-z*s,y*s+z*c]:ax===1?[x*c+z*s,y,-x*s+z*c]:[x*c-y*s,x*s+y*c,z]};
function draw(){
  const W=cv.width,S=W/5.4,Q=[];g.clearRect(0,0,W,W);
  for(const s of disp){
    const n=s.n,inL=anim&&s.p[anim.ax]===anim.sg,rot=v=>inL?rotV(v,anim.ax,anim.th):v;
    const nv=view(G(rot(n)));if(nv[2]<=0.001&&!anim)continue;
    const u=n[1]||n[2]?[1,0,0]:[0,1,0],vv=n[2]?[0,1,0]:[0,0,1],c=s.p.map((x,i)=>x+n[i]*0.5);
    const polys=[[0.5,'#0b0d10'],[0.43,COL[s.c]]].map(([h,col])=>[col,[[-1,-1],[1,-1],[1,1],[-1,1]].map(([i,j])=>view(G(rot(c.map((x,t)=>x+h*(i*u[t]+j*vv[t]))))))]);
    Q.push({z:view(G(rot(c)))[2],polys});
  }
  Q.sort((a,b)=>a.z-b.z);
  for(const q of Q)for(const [col,pts] of q.polys){g.beginPath();pts.forEach((P,k)=>{const X=W/2+P[0]*S,Y=W/2-P[1]*S;k?g.lineTo(X,Y):g.moveTo(X,Y)});g.closePath();g.fillStyle=col;g.fill()}
}
function pump(){ // anima los giros en cola (más rápido si se acumulan)
  if(anim||!queue.length)return;
  const m=queue.shift(),q=m.endsWith("'")?-1:m.endsWith('2')?2:1,n=FACES[m[0]],ax=n.findIndex(x=>x),sg=n[ax];
  const dur=Math.max(35,140/(1+queue.length)),t0=performance.now(),th=-sg*q*Math.PI/2;
  const step=now=>{const k=Math.min(1,(now-t0)/dur);anim={ax,sg,th:th*k*k*(3-2*k)};
    if(k<1){draw();requestAnimationFrame(step)}else{mv(disp,m);anim=null;draw();pump()}};
  requestAnimationFrame(step);
}
function showCube(c){cube=c;disp=clone(c);queue=[];anim=null;draw()}
function setFacelets(str,first){ // refleja el estado real que reporta el cubo (URFDLB)
  if(str.length!==54)return;const c=solvedCube();
  const P={U:(r,k)=>[-1+k,1,-1+r],R:(r,k)=>[1,1-r,1-k],F:(r,k)=>[-1+k,1-r,1],D:(r,k)=>[-1+k,-1,1-r],L:(r,k)=>[-1,1-r,-1+k],B:(r,k)=>[1-k,1-r,-1]};
  'URFDLB'.split('').forEach((f,fi)=>{for(let i=0;i<9;i++){const p=P[f](i/3|0,i%3);c.find(x=>x.n+''===FACES[f]+''&&x.p+''===p+'').c=str[fi*9+i]}});
  if(sig(c)===sig(cube)&&!first)return;
  showCube(c);if(first&&phase==='scramble')newScramble();else checkPhase();
}
function checkPhase(){if(phase==='scramble')trackSync();else if(phase==='running'&&isSolved(cube))finish()}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;A+=(e.clientX-drag[0])*0.01;Bt=Math.max(-1.4,Math.min(1.4,Bt+(e.clientY-drag[1])*0.01));drag=[e.clientX,e.clientY];draw()});
cv.addEventListener('pointerup',()=>drag=null);
document.getElementById('btnView').onclick=()=>{flip=!flip;draw()};

window.CM={solvedCube,mv,sig,isSolved,clone,FACES,COL,NAME}; // para el módulo de análisis
/* ===== Estado de la resolución ===== */
let cube=solvedCube(),phase='scramble',scr=[],targetSig='',t0=0,mvs=[],ti=0,pen=0,train=null,snap=null,gest=[];
const $=id=>document.getElementById(id);

const qmul=(a,b)=>({w:a.w*b.w-a.x*b.x-a.y*b.y-a.z*b.z,x:a.w*b.x+a.x*b.w+a.y*b.z-a.z*b.y,y:a.w*b.y-a.x*b.z+a.y*b.w+a.z*b.x,z:a.w*b.z+a.x*b.y-a.y*b.x+a.z*b.w});

  const pill=(txt,p,col)=>{x.font='600 22px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';const w=txt.length*13+26;
    x.fillStyle='rgba(11,13,16,.85)';x.beginPath();x.roundRect?x.roundRect(p[0]-w/2,p[1]-17,w,34,17):x.rect(p[0]-w/2,p[1]-17,w,34);x.fill();x.fillStyle=col;x.fillText(txt,p[0],p[1])};
  if(!st.axis){pill('Blanco',P([0,2.3,0]),'#e8ecf1');pill('Verde',P([0,-0.1,2.5]),'#3ddc97')}
  else{ // flecha curva alrededor del eje del giro
    const R=1.9,pts=[];for(let i=0;i<=24;i++){const f=-0.2+i/24*1.9;pts.push(P(st.off.map((o,t)=>o+R*(Math.cos(f)*st.u[t]+Math.sin(f)*st.v[t]))))}
    x.strokeStyle='#ffd54a';x.lineWidth=7;x.lineCap='round';x.setLineDash([2,12]);x.beginPath();pts.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.setLineDash([]);
    const e=pts[pts.length-1],b=pts[pts.length-3],ang=Math.atan2(e[1]-b[1],e[0]-b[0]);
    x.fillStyle='#ffd54a';x.beginPath();x.moveTo(e[0]+Math.cos(ang)*18,e[1]+Math.sin(ang)*18);x.lineTo(e[0]+Math.cos(ang+2.4)*18,e[1]+Math.sin(ang+2.4)*18);x.lineTo(e[0]+Math.cos(ang-2.4)*18,e[1]+Math.sin(ang-2.4)*18);x.closePath();x.fill();
  }
  demoRaf=still?0:requestAnimationFrame(drawDemo);
}
function calShow(){
  const st=CAL[calStep];$('calT').textContent=st.t;$('calAct').textContent=st.a;$('calTxt').textContent=st.d;
  $('calDots').innerHTML=CAL.map((_,i)=>'<span class="'+(i<calStep?'done':i===calStep?'on':'')+'"></span>').join('');
  if(!DEMO.length)DEMO=solvedCube();
  if(!demoRaf)demoRaf=requestAnimationFrame(drawDemo);
  calUpdate();
}
function calUpdate(){ // medidor en vivo: solo deja avanzar cuando el giro es el correcto
  if(!$('dlgCal').open)return;
  const next=$('calNext'),bar=$('calBar'),lab=$('calAng');
  if(!gRaw){bar.style.width='0%';bar.className='';lab.textContent='Aún no llegan datos del giroscopio. Mueve un poco el cubo para despertarlo.';next.disabled=true;return}
  if(calStep===0){bar.style.width='100%';bar.className='ok';lab.textContent='Cubo detectado ✓ Sujétalo quieto y pulsa Siguiente';next.disabled=false;return}
  const r=relQ(gRaw,gq0),ang=2*Math.acos(Math.min(1,r.w))*180/Math.PI,ok=ang>=65&&ang<=160;
  bar.style.width=Math.min(100,ang/90*100)+'%';bar.className=ok?'ok':'';
  lab.textContent=ang<12?'En la posición inicial':Math.round(ang)+'° · '+(ok?'Perfecto ✓ mantenlo y pulsa Siguiente':ang>160?'Te has pasado: vuelve hacia ~90°':'sigue girando hasta ~90°');
  next.disabled=!ok;
}
$('btnCal').onclick=()=>{$('dlg').close();calStep=0;calQs=[];$('dlgCal').showModal();calShow()};
$('calX').onclick=()=>$('dlgCal').close();$('calCancel').onclick=()=>$('dlgCal').close();
$('calNext').onclick=()=>{
  if(!gRaw)return toast('Aún no llegan datos del giroscopio');
  if(calStep===0)gq0=gRaw;else calQs.push(gRaw);
  if(calStep===3){const M=calcM(gq0,calQs);
    if(!M){toast('Algún giro fue demasiado pequeño. Repite la calibración.');calStep=0;calQs=[];calShow();return}
    gM=M;try{localStorage.setItem('gyroCal',JSON.stringify(M))}catch(e){}
    $('dlgCal').close();toast('Giroscopio calibrado ✓ Vuelve a la posición inicial');onGyro(gRaw);return}
  calStep++;calShow();
};
$('btnGyro').onclick=()=>{if(gRaw){gq0=gRaw;onGyro(gRaw);toast('Orientación centrada')}};
$('oGyro').onchange=e=>setGyro(e.target.checked);

/* ===== Análisis, entrenamiento y gestos ===== */
let alertTimer=0,alertData=null;
function showAlert(r){
  alertData=r;const c=Insight.getCase(r.kind,r.id);
  $('alIcon').innerHTML=c.icon;
  $('alTitle').textContent='Podrías ahorrar '+r.save.toFixed(2)+' segundos en tu resolución';
  $('alText').textContent=(r.kind==='OLL'?'Aprende el algoritmo de un solo paso para este caso: ':'Reconoce este caso y ejecútalo de una vez: ')+r.label+'.';
  $('alert').hidden=false;const b=$('alBar');b.style.animation='none';void b.offsetWidth;b.style.animation='';
  clearTimeout(alertTimer);alertTimer=setTimeout(hideAlert,14000);
}
function hideAlert(){$('alert').hidden=true;alertData=null;clearTimeout(alertTimer)}
function renderTrain(){
  const bar=$('trainbar');bar.hidden=!train;if(!train)return;
  $('trIcon').innerHTML=train.icon;$('trTitle').textContent='Entrenando '+train.label;$('trAlg').textContent=train.alg;
  $('trStat').textContent=train.times.length?train.times.length+' repeticiones · última '+fmt(train.times[train.times.length-1])+' · mejor '+fmt(Math.min(...train.times)):'Deja el cubo resuelto: la app preparará el caso por ti';
}
function startTrain(kind,id){
  if(!isSolved(cube)){toast('Deja el cubo resuelto para empezar el ejercicio');return}
  train={...Insight.getCase(kind,id),times:[]};hideAlert();renderTrain();newScramble();
}
function exitTrain(){train=null;renderTrain();newScramble();$('timer').textContent='0.00'}
function finishTrain(t){
  train.times.push(t);celebrate();renderTrain();newScramble();
  $('timer').textContent=fmt(t);$('live').textContent=train.label+' · '+fmt(t);
}
function gesture(f){ // 4 giros seguidos de la misma cara con el cubo real
  if(f==='R'&&alertData){const a=alertData;startTrain(a.kind,a.id)}
  else if(f==='L'&&alertData)hideAlert();
  else if(f==='U'&&cfg.gyro&&gRaw){gq0=gRaw;onGyro(gRaw);toast('Orientación centrada')}
}
$('alLearn').onclick=()=>{if(alertData)startTrain(alertData.kind,alertData.id)};
$('alDismiss').onclick=hideAlert;$('trExit').onclick=exitTrain;
$('oIns').onchange=e=>{cfg.insight=e.target.checked;saveCfg();if(!cfg.insight)hideAlert()};

/* ===== Bluetooth ===== */
const SERVICES=['6e400001-b5a3-f393-e0a9-e50e24dc4179','00000010-0000-fff7-fff6-fff5fff4fff0','0000aadb-0000-1000-8000-00805f9b34fb',
  '0000fff0-0000-1000-8000-00805f9b34fb','0783b03e-7735-b5a0-1760-a305d2795cb0','0000180a-0000-1000-8000-00805f9b34fb'];
/* Decodificadores por marca: reciben bytes y llaman onMove("R'") etc. Se añadirán cuando sepamos la marca. */
const DRIVERS={/* 'GAN': bytes=>{...}, 'GiiKER': bytes=>{...} */};
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join(' ');
let lines=[];const log=s=>{lines.push(s);lines=lines.slice(-30);$('log').textContent=lines.join('\n')};
async function rawConnect(){
  if(!navigator.bluetooth){toast('Web Bluetooth no está disponible. Usa Chrome en Android u ordenador (no iOS).');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SERVICES});
    const srv=await dev.gatt.connect();$('status').textContent=dev.name||'Cubo';$('status').className='on';
    dev.addEventListener('gattserverdisconnected',()=>{$('status').textContent='Desconectado';$('status').className=''});
    const drv=Object.keys(DRIVERS).find(k=>(dev.name||'').startsWith(k));
    log('Dispositivo: '+dev.name+(drv?' (driver '+drv+')':' (sin driver aún)'));
    for(const sv of await srv.getPrimaryServices()){
      log('Servicio '+sv.uuid);
      for(const ch of await sv.getCharacteristics()){
        log('  char '+ch.uuid+' '+Object.keys(ch.properties).filter(k=>ch.properties[k]).join(','));
        if(ch.properties.notify){await ch.startNotifications();
          ch.addEventListener('characteristicvaluechanged',e=>{const b=new Uint8Array(e.target.value.buffer);log(ch.uuid.slice(4,8)+': '+hex(b));if(drv)DRIVERS[drv](b,onMove)})}
      }}
    toast('Conectado a '+(dev.name||'cubo'));
  }catch(e){toast('No se pudo conectar: '+e.message)}
}
window.app={onMove:m=>onMove(m),toast,log,gyro:onGyro,gyroWatch,setStatus:(t,on)=>{$('status').textContent=t;$('status').className=on?'on':'';if(!on)curDev=null;renderDevs()},getDevice:n=>devices.find(d=>d.id===n),registerDevice:(n,mac)=>{let d=devices.find(x=>x.id===n);if(!d)devices.push(d={id:n,mac,alias:''});d.mac=mac;curDev=n;saveDev();renderDevs()},setFacelets,resync:()=>{showCube(solvedCube());newScramble()}};
$('btnConn').onclick=()=>window.connectCube?window.connectCube(window.app):rawConnect();

/* ===== Arranque ===== */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
$('btnGyro').hidden=!cfg.gyro;
draw();renderStats();newScramble();
</script>
